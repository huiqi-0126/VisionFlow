<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}VisionFlow{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50:'#eef2ff',100:'#e0e7ff',200:'#c7d2fe',300:'#a5b4fc',400:'#818cf8',500:'#6366f1',600:'#4f46e5',700:'#4338ca',800:'#3730a3',900:'#312e81' }
          }
        }
      }
    }
  </script>
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #1e1b4b; }
    ::-webkit-scrollbar-thumb { background: #4338ca; border-radius: 3px; }
    @keyframes pulse-dot { 0%,100%{ opacity:1; } 50%{ opacity:.4; } }
    .pulse-dot { animation: pulse-dot 1.5s ease-in-out infinite; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .fade-in { animation: fadeIn .3s ease-out; }
  </style>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>VF</text></svg>">
</head>
<body class="bg-gray-950 text-gray-200 min-h-screen flex flex-col">

  <!-- 顶部导航 -->
  <nav class="bg-gray-900/80 backdrop-blur border-b border-gray-800 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 flex items-center justify-between h-14">
      <a href="/" class="flex items-center gap-2 text-lg font-bold">
        <span class="text-brand-400">Vision</span><span class="text-gray-300">Flow</span>
        <span class="text-xs bg-brand-600/30 text-brand-300 px-1.5 py-0.5 rounded ml-1">视频复刻</span>
      </a>
      <div class="flex gap-1">
        {% set nav_items = [
          ("index", "/", "项目列表"),
          ("planner", "/planner", "内容规划"),
          ("tasks", "/tasks", "历史记录"),
        ] %}
        {% for id, href, label in nav_items %}
        <a href="{{ href }}"
           class="px-3 py-1.5 rounded-md text-sm font-medium transition-colors
                  {% if page_id == id %}bg-brand-600/20 text-brand-300
                  {% else %}text-gray-400 hover:text-gray-200 hover:bg-gray-800{% endif %}">
          {{ label }}
        </a>
        {% endfor %}
      </div>
    </div>
  </nav>

  <!-- 主内容 -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6">
    {% block content %}{% endblock %}
  </main>

  <!-- 底部 -->
  <footer class="border-t border-gray-800 py-3 text-center text-xs text-gray-600">
    VisionFlow &mdash; AI 视频复刻工具
  </footer>

  <script src="/static/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
